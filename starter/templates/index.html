<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app-shell">
    <div class="page-header">
      <h1>Sudoku Game</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Dark Mode</button>
    </div>
    <div id="sudoku-board" aria-label="Sudoku board"></div>
    <div class="controls">
      <label for="difficulty-select">Difficulty:</label>
      <select id="difficulty-select">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="new-game">New Game</button>
      <button id="hint-solution">Hint</button>
      <button id="check-solution">Check Puzzle</button>
      <span id="message" role="status"></span>
    </div>
    <div class="status-bar">
      <span id="timer-display">Time: 00:00</span>
    </div>
    <section class="leaderboard" aria-labelledby="leaderboard-title">
      <h2 id="leaderboard-title">Top 10 Fastest Times</h2>
      <ol id="leaderboard-list"></ol>
    </section>
  </main>
  <script src="/static/main.js"></script>
</body>
</html>
